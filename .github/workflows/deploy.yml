# Build the site with PHP 8.4 and publish it to GitHub Pages.
# Runs on every push to main, and can be started by hand from the Actions tab.
# See docs/DEPLOYMENT.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint PHP
        run: find build.php src config content templates -name '*.php' -print0 | xargs -0 -n1 php -l

      # Tells us the real Pages URL and path prefix ("/mattryan-xyz" for a
      # project page, "" for a custom domain).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: php build.php

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          # v4+ skips dotfiles by default; keep .nojekyll in the artifact.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
